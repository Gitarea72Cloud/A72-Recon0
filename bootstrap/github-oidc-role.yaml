AWSTemplateFormatVersion: '2010-09-09'
Description: >
  One-time, account-side setup for A72-Recon0's GitHub Actions pipeline.
  Deploy this with credentials for account 738388288350 (any profile that
  can assume/use that account works — an agent session with a configured
  AWS CLI profile can run this too). After this exists, every push to main
  deploys via OIDC with no long-lived AWS keys stored in GitHub.

Parameters:
  GitHubOrg:
    Type: String
    Default: Gitarea72Cloud
  RepoName:
    Type: String
    Default: A72-Recon0
  GitHubOrgId:
    Type: String
    Default: "183365091"
    Description: >
      GitHub's immutable numeric ID for GitHubOrg. GitHub includes this in
      the OIDC token's `sub` claim (repo:ORG@ORGID/REPO@REPOID:...) whenever
      the org or repo has ever been renamed/transferred, to stop a renamed-
      away name from being reclaimed and reused against an old trust policy.
      Find the current value by decoding a token from this repo's Actions
      run (see DEPLOY.md) if this ever needs to change.
  GitHubRepoId:
    Type: String
    Default: "1361019233"
    Description: GitHub's immutable numeric ID for RepoName. See GitHubOrgId.
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Set to "false" if this account already has a GitHub Actions OIDC
      provider (arn:aws:iam::<account>:oidc-provider/token.actions.githubusercontent.com)
      — check with: aws iam list-open-id-connect-providers

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        # GitHub's OIDC thumbprint rotates rarely; AWS validates the cert
        # chain regardless, this is a defense-in-depth fallback value.
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: A72Recon0-GitHubActionsDeployRole
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # Deploys only from pushes to main on this exact repo — not
                # forks, not other branches, not pull_request events. Uses
                # the ID-qualified subject form (see GitHubOrgId/GitHubRepoId)
                # because GitHub sends that form once an org/repo has ever
                # been renamed or transferred.
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}@${GitHubOrgId}/${RepoName}@${GitHubRepoId}:ref:refs/heads/main
      Policies:
        - PolicyName: A72Recon0DeployPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudFormationDeploy
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ListStackResources
                Resource:
                  - !Sub arn:aws:cloudformation:*:${AWS::AccountId}:stack/a72-recon0-*/*
                  - !Sub arn:aws:cloudformation:*:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*
                  # Every SAM-templated deploy expands the AWS::Serverless
                  # transform via CloudFormation; this is an AWS-owned
                  # resource, not account-scoped, so it's listed separately.
                  - "arn:aws:cloudformation:*:aws:transform/Serverless-2016-10-31"
              - Sid: SamDeploymentBucket
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:PutBucketPolicy
                  - s3:GetBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:PutBucketTagging
                  - s3:GetBucketTagging
                  - s3:TagResource
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutBucketVersioning
                  - s3:GetBucketVersioning
                  - s3:PutEncryptionConfiguration
                  - s3:GetEncryptionConfiguration
                Resource:
                  - "arn:aws:s3:::aws-sam-cli-managed-default*"
                  - "arn:aws:s3:::a72-recon0-web-*"
              - Sid: LambdaAndLayers
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:GetFunction
                  - lambda:DeleteFunction
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:GetFunctionConfiguration
                  - lambda:ListVersionsByFunction
                  - lambda:PublishVersion
                  - lambda:PublishLayerVersion
                  - lambda:GetLayerVersion
                  - lambda:DeleteLayerVersion
                  - lambda:TagResource
                Resource:
                  - !Sub arn:aws:lambda:*:${AWS::AccountId}:function:a72-recon0-*
                  - !Sub arn:aws:lambda:*:${AWS::AccountId}:layer:a72-recon0-*
                  - !Sub arn:aws:lambda:*:${AWS::AccountId}:layer:a72-recon0-*:*
              - Sid: ApiGateway
                Effect: Allow
                Action:
                  - apigateway:*
                Resource:
                  - "arn:aws:apigateway:*::/apis"
                  - "arn:aws:apigateway:*::/apis/*"
              - Sid: DynamoDb
                Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DeleteTable
                  - dynamodb:DescribeTable
                  - dynamodb:UpdateTable
                  - dynamodb:TagResource
                Resource:
                  - !Sub arn:aws:dynamodb:*:${AWS::AccountId}:table/a72-recon0-*
              - Sid: CloudFront
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:GetDistribution
                  - cloudfront:UpdateDistribution
                  - cloudfront:DeleteDistribution
                  - cloudfront:TagResource
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: "*"  # CloudFront distribution/OAC ARNs are only known after creation, same as Cognito below
              - Sid: Cognito
                Effect: Allow
                Action:
                  - cognito-idp:CreateUserPool
                  - cognito-idp:DeleteUserPool
                  - cognito-idp:UpdateUserPool
                  - cognito-idp:CreateUserPoolClient
                  - cognito-idp:DeleteUserPoolClient
                  - cognito-idp:UpdateUserPoolClient
                  - cognito-idp:CreateGroup
                  - cognito-idp:DeleteGroup
                  - cognito-idp:GetGroup
                  - cognito-idp:UpdateGroup
                  - cognito-idp:DescribeUserPool
                  - cognito-idp:TagResource
                Resource: "*"  # Cognito ARNs are only known after creation; tighten with a naming-tag condition if desired
              - Sid: IamForLambdaExecRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PassRole
                  - iam:TagRole
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/a72-recon0-*
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DescribeLogGroups
                Resource:
                  - !Sub arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/lambda/a72-recon0-*

Outputs:
  DeployRoleArn:
    Description: Put this in the repo's GitHub Actions variables/secrets as AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt GitHubActionsDeployRole.Arn
