AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  A72-Recon0 — adaptive placement test for the Evolve Master in Cybersecurity.
  Fully serverless: Cognito (auth), API Gateway HTTP API, Lambda, DynamoDB,
  S3 static hosting. No VPC.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Deployment stage / environment name.
  CloudFrontDistributionId:
    Type: String
    Default: ""
    Description: >
      ID of the CloudFront distribution fronting WebsiteBucket, created
      OUTSIDE this stack (see DEPLOY.md — this account's CloudFront access
      is gated behind AWS account verification, which as of writing blocks
      CloudFormation/API distribution creation but not console creation).
      Leave blank until that distribution exists; the bucket policy that
      grants it read access is skipped until this is set.

Conditions:
  HasCloudFrontDistribution: !Not [!Equals [!Ref CloudFrontDistributionId, ""]]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    Architectures: [arm64]
    Environment:
      Variables:
        TABLE_NAME: !Ref DataTable
        STAGE: !Ref Stage

Resources:

  # ---------------------------------------------------------------------
  # Shared code (db / scoring / auth helpers) as a layer, not copy-pasted
  # into every function directory.
  # ---------------------------------------------------------------------
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub a72-recon0-common-${Stage}
      ContentUri: layer/
      CompatibleRuntimes: [python3.12]
      RetentionPolicy: Delete

  # ---------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub a72-recon0-${Stage}
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true # students are bulk-imported, no open self-signup
        InviteMessageTemplate:
          EmailSubject: "Your A72-Recon0 placement test account"
          EmailMessage: "Username: {username} / temporary password: {####}. You'll be asked to set a new password on first login."
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          Required: true
          Mutable: true

  UserPoolInstructorsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: instructors
      UserPoolId: !Ref UserPool
      Description: Gates the admin-only API routes.

  # Cohort membership groups follow the naming convention
  # cohort-<n>-<yyyy>-<mm>. The frontend footer reads this straight off
  # the ID token's cognito:groups claim (see frontend/app.js
  # getCohortLabel) instead of a separate cohort-metadata table -- add a
  # new AWS::Cognito::UserPoolGroup per intake and assign students to it
  # (e.g. `aws cognito-idp admin-add-user-to-group`) and the footer picks
  # it up automatically, no other deploy needed.
  UserPoolCohort1Group:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: cohort-1-2026-10
      UserPoolId: !Ref UserPool
      Description: "Cohort 1, intake October 2026."

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub a72-recon0-web-${Stage}
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED

  # ---------------------------------------------------------------------
  # Data — single table, keyed by cohort/checkpoint from day one
  # ---------------------------------------------------------------------
  DataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub a72-recon0-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  # ---------------------------------------------------------------------
  # API
  # ---------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins: ["*"]  # tighten to the deployed website origin once known
        AllowHeaders: ["Authorization", "Content-Type"]
        AllowMethods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
      Auth:
        Authorizers:
          CognitoAuthorizer:
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient
            IdentitySource: "$request.header.Authorization"
        DefaultAuthorizer: CognitoAuthorizer

  StartSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/start_session/
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /session/start
            Method: POST

  TerminalExecFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/terminal_exec/
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /session/{sessionId}/terminal
            Method: POST

  PowershellExecFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/powershell_exec/
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /session/{sessionId}/powershell
            Method: POST

  SubmitAnswerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/submit_answer/
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /session/{sessionId}/answer
            Method: POST

  GetHintFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/get_hint/
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /session/{sessionId}/hint
            Method: POST

  GetResultFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/get_result/
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /session/{sessionId}/result
            Method: GET

  AdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/admin/
      Handler: app.lambda_handler
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          BEDROCK_MAX_SPEND_USD: "20"
          NOTIFICATION_FROM_EMAIL: morillasfj@gmail.com
          NOTIFICATION_SES_REGION: eu-west-1
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:ListUsersInGroup
              Resource: !GetAtt UserPool.Arn
            - Sid: BedrockQuestionGeneration
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                # The inference profile is what gets invoked; Bedrock also
                # requires permission on the underlying foundation model
                # ARN(s) it routes to (the "EU" profile can land in any
                # EU region), scoped to this one model, not all of Bedrock.
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/eu.anthropic.claude-haiku-4-5-20251001-v1:0
                - !Sub arn:aws:bedrock:eu-*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
            - Sid: SESNotifications
              Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              # SES lives in eu-west-1 regardless of this stack's own
              # region (eu-south-2 doesn't have SES at all) -- see
              # bootstrap/ses-notification-identity.yaml.
              Resource: !Sub arn:aws:ses:eu-west-1:${AWS::AccountId}:identity/morillasfj@gmail.com
      Events:
        Questions:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/questions
            Method: POST
        QuestionsList:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/questions
            Method: GET
        QuestionsGenerate:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/questions/generate
            Method: POST
        QuestionGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/questions/{domain}/{itemId}
            Method: GET
        QuestionUpdate:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/questions/{domain}/{itemId}
            Method: PUT
        QuestionDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/questions/{domain}/{itemId}
            Method: DELETE
        Results:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/results
            Method: GET
        Students:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/students
            Method: GET
        StudentProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/students/{studentId}
            Method: GET
        StudentReset:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/students/{studentId}/reset
            Method: POST
        Feedback:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/feedback
            Method: GET
        ModulesList:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/modules
            Method: GET
        ModuleUpdate:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/modules/{moduleId}
            Method: PUT

  ModulesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/modules/
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /modules
            Method: GET

  NotificationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/notifications/
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        List:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /notifications
            Method: GET
        MarkRead:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /notifications/{notificationId}/read
            Method: POST

  SubmitFeedbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/submit_feedback/
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /session/{sessionId}/feedback
            Method: POST

  LogTranslationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/log_translation/
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /session/{sessionId}/translate
            Method: POST

  SubmitSurveyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/submit_survey/
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /session/{sessionId}/survey
            Method: POST

  # ---------------------------------------------------------------------
  # Static site — private S3 origin, meant to sit behind a CloudFront
  # distribution with Origin Access Control. Not a public S3 website
  # bucket: this account has S3 Block Public Access enabled at the account
  # level, so a public bucket policy is rejected outright.
  #
  # The distribution itself is NOT created here: this account's CloudFront
  # access is gated behind AWS account verification (a fraud-prevention
  # check, unrelated to IAM) that as of writing blocks
  # CloudFormation/API-driven distribution creation but not the console —
  # see DEPLOY.md for the exact config to create it by hand once, then
  # pass its ID back in via CloudFrontDistributionId.
  # ---------------------------------------------------------------------
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub a72-recon0-web-${Stage}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: HasCloudFrontDistribution
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${WebsiteBucket}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistributionId}

Outputs:
  ApiUrl:
    Description: HTTP API base URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  WebsiteBucketName:
    Value: !Ref WebsiteBucket
  TableName:
    Value: !Ref DataTable
