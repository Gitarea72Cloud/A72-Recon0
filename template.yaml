AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  A72-Recon0 — adaptive placement test for the Evolve Master in Cybersecurity.
  Fully serverless: Cognito (auth), API Gateway HTTP API, Lambda, DynamoDB,
  S3 static hosting. No VPC.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Deployment stage / environment name.
  CloudFrontDistributionId:
    Type: String
    Default: ""
    Description: >
      ID of the CloudFront distribution fronting WebsiteBucket, created
      OUTSIDE this stack (see DEPLOY.md — this account's CloudFront access
      is gated behind AWS account verification, which as of writing blocks
      CloudFormation/API distribution creation but not console creation).
      Leave blank until that distribution exists; the bucket policy that
      grants it read access is skipped until this is set.

Conditions:
  HasCloudFrontDistribution: !Not [!Equals [!Ref CloudFrontDistributionId, ""]]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    Architectures: [arm64]
    Environment:
      Variables:
        TABLE_NAME: !Ref DataTable
        STAGE: !Ref Stage

Resources:

  # ---------------------------------------------------------------------
  # Shared code (db / scoring / auth helpers) as a layer, not copy-pasted
  # into every function directory.
  # ---------------------------------------------------------------------
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub a72-recon0-common-${Stage}
      ContentUri: layer/
      CompatibleRuntimes: [python3.12]
      RetentionPolicy: Delete

  # ---------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub a72-recon0-${Stage}
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true # students are bulk-imported, no open self-signup
        InviteMessageTemplate:
          EmailSubject: "Your A72-Recon0 placement test account"
          EmailMessage: "Username: {username} / temporary password: {####}. You'll be asked to set a new password on first login."
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          Required: true
          Mutable: true

  UserPoolInstructorsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: instructors
      UserPoolId: !Ref UserPool
      Description: Gates the admin-only API routes.

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub a72-recon0-web-${Stage}
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED

  # ---------------------------------------------------------------------
  # Data — single table, keyed by cohort/checkpoint from day one
  # ---------------------------------------------------------------------
  DataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub a72-recon0-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  # ---------------------------------------------------------------------
  # API
  # ---------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins: ["*"]  # tighten to the deployed website origin once known
        AllowHeaders: ["Authorization", "Content-Type"]
        AllowMethods: ["GET", "POST", "OPTIONS"]
      Auth:
        Authorizers:
          CognitoAuthorizer:
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient
            IdentitySource: "$request.header.Authorization"
        DefaultAuthorizer: CognitoAuthorizer

  StartSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/start_session/
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /session/start
            Method: POST

  TerminalExecFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/terminal_exec/
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /session/{sessionId}/terminal
            Method: POST

  PowershellExecFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/powershell_exec/
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /session/{sessionId}/powershell
            Method: POST

  SubmitAnswerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/submit_answer/
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /session/{sessionId}/answer
            Method: POST

  GetResultFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/get_result/
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /session/{sessionId}/result
            Method: GET

  AdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/admin/
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        Questions:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/questions
            Method: POST
        Results:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/results
            Method: GET

  # ---------------------------------------------------------------------
  # Static site — private S3 origin, meant to sit behind a CloudFront
  # distribution with Origin Access Control. Not a public S3 website
  # bucket: this account has S3 Block Public Access enabled at the account
  # level, so a public bucket policy is rejected outright.
  #
  # The distribution itself is NOT created here: this account's CloudFront
  # access is gated behind AWS account verification (a fraud-prevention
  # check, unrelated to IAM) that as of writing blocks
  # CloudFormation/API-driven distribution creation but not the console —
  # see DEPLOY.md for the exact config to create it by hand once, then
  # pass its ID back in via CloudFrontDistributionId.
  # ---------------------------------------------------------------------
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub a72-recon0-web-${Stage}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: HasCloudFrontDistribution
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${WebsiteBucket}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistributionId}

Outputs:
  ApiUrl:
    Description: HTTP API base URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  WebsiteBucketName:
    Value: !Ref WebsiteBucket
  TableName:
    Value: !Ref DataTable
