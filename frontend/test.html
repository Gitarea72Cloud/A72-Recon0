<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test — A72-Recon0</title>
<link rel="stylesheet" href="theme.css">
<style>
  .testwrap { max-width: 1040px; margin: 0 auto; padding: 32px 24px 100px; }

  /* ---- begin screen ---- */
  .begin { text-align: center; padding: 40px 0; }
  .begin h1 { font-size: 26px; margin-bottom: 10px; }
  .begin p { color: var(--muted); max-width: 46ch; margin: 0 auto 26px; }

  /* ---- top row: progress + timer ---- */
  .test-topbar { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .progress-row { display: flex; align-items: center; gap: 12px; flex: 1; }
  .progress-row .label { font-size: 13px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .progress-track { flex: 1; height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s; }
  .test-timer {
    font-family: ui-monospace, monospace; font-size: 13px; color: var(--muted);
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px;
    padding: 5px 10px; white-space: nowrap;
  }

  /* ---- main layout: question column + hints sidebar ---- */
  .test-layout { display: grid; grid-template-columns: 1fr 260px; gap: 24px; align-items: start; }
  @media (max-width: 760px) { .test-layout { grid-template-columns: 1fr; } }

  .prompt-card { margin-bottom: 20px; }
  .prompt-card h2 { font-size: 17px; margin: 0; }

  /* ---- terminal ---- */
  .term-panel {
    background: var(--code-bg); border-radius: 12px; overflow: hidden;
    border: 1px solid var(--line); box-shadow: var(--shadow);
    display: flex; flex-direction: column; height: 320px; margin-bottom: 20px;
  }
  .term-panel.shell-powershell { background: #012456; border-color: #01173a; }
  .term-titlebar { display: flex; align-items: center; gap: 6px; padding: 9px 12px; background: rgba(255,255,255,.04); border-bottom: 1px solid rgba(255,255,255,.07); flex: 0 0 auto; }
  .term-panel.shell-powershell .term-titlebar { background: rgba(255,255,255,.06); border-bottom-color: rgba(255,255,255,.12); }
  .term-dot { width: 9px; height: 9px; border-radius: 50%; opacity: .85; }
  .term-dot.r { background: #ff5f56; } .term-dot.y { background: #ffbd2e; } .term-dot.g { background: #27c93f; }
  .term-name { margin-left: 6px; font-family: ui-monospace, monospace; font-size: 11px; color: #8296ac; }
  .term-panel.shell-powershell .term-name { color: #b9c9f0; }
  .term-screen { flex: 1; overflow-y: auto; padding: 12px 14px; font-family: ui-monospace, monospace; font-size: 12.8px; color: var(--code-ink); line-height: 1.65; }
  .term-panel.shell-powershell .term-screen { color: #eef2ff; }
  .term-line { white-space: pre-wrap; word-break: break-word; }
  .term-line.term-cmd { color: #7fe3d4; }
  .term-panel.shell-powershell .term-line.term-cmd { color: #ffe066; }
  .term-line.term-err { color: #ff8a8a; }
  .term-line.term-banner { color: #8296ac; }
  .term-panel.shell-powershell .term-line.term-banner { color: #b9c9f0; }
  .term-inputrow { display: flex; align-items: center; gap: 8px; padding: 8px 14px 11px; flex: 0 0 auto; }
  .term-ps1 { font-size: 12.5px; white-space: nowrap; font-family: ui-monospace, monospace; }
  .term-input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: var(--code-ink); font-size: 12.8px; font-family: ui-monospace, monospace; }
  .term-panel.shell-powershell .term-input { color: #eef2ff; }

  .answer-row { display: flex; gap: 10px; }
  .answer-row input { flex: 1; }
  .answer-note { font-size: 12.5px; color: var(--muted); margin-top: 8px; }

  /* ---- hints sidebar ---- */
  .hints-panel { position: sticky; top: 90px; }
  .hints-panel h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 12px; }
  .hint-btn {
    display: flex; align-items: center; justify-content: space-between; width: 100%;
    text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 8px; font-size: 13.5px; font-weight: 600; color: var(--ink);
    cursor: pointer; font-family: inherit;
  }
  .hint-btn:hover:not(:disabled) { border-color: var(--accent); }
  .hint-btn:disabled { opacity: .45; cursor: not-allowed; }
  .hint-btn .cost { font-size: 11px; font-weight: 600; color: var(--danger); }
  .hint-text {
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 8px; font-size: 13.5px; line-height: 1.5;
  }
  .hint-text .n { color: var(--accent); font-weight: 700; margin-right: 4px; }

  /* ---- away-message toast ---- */
  .away-toast {
    position: fixed; bottom: 24px; right: 24px; max-width: 320px;
    background: var(--ink); color: var(--bg); border-radius: 10px; padding: 14px 16px;
    font-size: 14px; box-shadow: var(--shadow); z-index: 50;
    animation: away-in .25s ease-out;
  }
  @keyframes away-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ---- result ---- */
  .result { text-align: center; padding: 40px 0; }
  .result .track-badge { font-size: 15px; padding: 8px 18px; margin-bottom: 18px; }
  .result h1 { font-size: 28px; margin-bottom: 12px; }
  .result p.blurb { color: var(--muted); max-width: 50ch; margin: 0 auto 30px; }
  .score-grid { margin: 0 auto 30px; max-width: 420px; }
</style>
</head>
<body>

<div class="topnav">
  <div class="brand">A72<span>-Recon0</span></div>
  <nav>
    <a href="index.html">Home</a>
    <a href="help.html">Help</a>
    <span id="authNav"></span>
  </nav>
</div>

<main>
  <div class="testwrap" id="app">
    <div class="begin">
      <p class="muted">Loading…</p>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6/dist/amazon-cognito-identity.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(function () {
  const app = document.getElementById("app");
  let sessionId = null;
  let testActive = false;
  let timerStart = null;
  let timerInterval = null;
  let hintsUnlocked = 0;

  const SHELL_CONFIG = {
    linux_cli: {
      endpoint: "terminal", css: "",
      promptHtml: '<span style="color:#6fd68a">student@a72-recon0</span><span style="color:#8296ac">:</span><span style="color:#7fb3ff">~</span><span style="color:#8296ac">$</span>',
      promptText: "student@a72-recon0:~$",
      title: "student@a72-recon0 — bash",
      banner: () => `Last login: ${new Date().toString().replace(/ GMT.*/, "")} from 10.0.2.15`,
    },
    windows_cli: {
      endpoint: "powershell", css: "shell-powershell",
      promptHtml: '<span style="color:#ffe066">PS</span> <span style="color:#eef2ff">C:\\Users\\student&gt;</span>',
      promptText: "PS C:\\Users\\student>",
      title: "Windows PowerShell",
      banner: () => "Windows PowerShell\nCopyright (C) Microsoft Corporation. All rights reserved.",
    },
  };
  function shellFor(item) {
    return SHELL_CONFIG[item.domain] || SHELL_CONFIG.linux_cli;
  }

  // Rotates through varied messages so it doesn't feel like the same
  // canned line every time; never repeats the last one shown back to back.
  const AWAY_MESSAGES = [
    "Welcome back \u{1F440} we know you were off consulting the ancient scrolls (Stack Overflow).",
    "Oh look, you're back! Find what you were looking for out there? \u{1F608}",
    "No judgment here \u{1F92D} everyone Googles the flags sometimes.",
    "Tab-switching detected. We'll allow it \u{1F60F} this time.",
    "Back so soon? Must've been a good search result.",
    "We see you \u{1F441}\uFE0F There's no shame in a quick lookup \u2014 just own it.",
  ];
  let lastAwayIdx = -1;
  function showAwayToast() {
    let idx = Math.floor(Math.random() * AWAY_MESSAGES.length);
    if (idx === lastAwayIdx) idx = (idx + 1) % AWAY_MESSAGES.length;
    lastAwayIdx = idx;
    const toast = document.createElement("div");
    toast.className = "away-toast";
    toast.textContent = AWAY_MESSAGES[idx];
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 5000);
  }
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && testActive) showAwayToast();
  });

  function startTimer() {
    timerStart = Date.now();
    clearInterval(timerInterval);
    timerInterval = setInterval(updateTimerDisplay, 1000);
  }
  function stopTimer() {
    clearInterval(timerInterval);
    testActive = false;
  }
  function updateTimerDisplay() {
    const el = document.getElementById("testTimer");
    if (!el) return;
    const secs = Math.floor((Date.now() - timerStart) / 1000);
    const m = String(Math.floor(secs / 60)).padStart(2, "0");
    const s = String(secs % 60).padStart(2, "0");
    el.textContent = m + ":" + s;
  }

  function renderBegin() {
    testActive = false;
    app.innerHTML =
      '<div class="begin">' +
      '<h1>Ready when you are</h1>' +
      '<p>20 questions in a simulated terminal — 10 Linux, 10 PowerShell. Hints are available if you get stuck, but they cost credit. Once you start, your result is final — see the <a href="help.html">help page</a> for the full rules.</p>' +
      '<button class="btn btn-primary" id="beginBtn">Begin the test</button>' +
      "</div>";
    document.getElementById("beginBtn").addEventListener("click", begin);
  }

  function renderError(message, opts) {
    opts = opts || {};
    app.innerHTML =
      '<div class="alert alert-error">' + message + "</div>" +
      (opts.retry ? '<button class="btn btn-secondary" id="retryBtn">Try again</button>' : "");
    if (opts.retry) document.getElementById("retryBtn").addEventListener("click", renderBegin);
  }

  async function begin() {
    app.innerHTML = '<div class="begin"><p class="muted">Starting…</p></div>';
    try {
      const res = await A72.apiFetch("/session/start", { method: "POST" });
      if (!res.item) {
        renderError("No questions are loaded yet — ask your instructor to seed the question bank.");
        return;
      }
      sessionId = res.sessionId;
      startTimer();
      renderQuestion(res.item, res.itemIndex, res.totalItems);
    } catch (err) {
      if (err.status === 409 && err.body && err.body.sessionId) {
        showResult(err.body.sessionId, err.body.track);
      } else {
        renderError("Couldn't start the test: " + err.message, { retry: true });
      }
    }
  }

  function appendLine(screen, text, cls) {
    const div = document.createElement("div");
    div.className = "term-line" + (cls ? " " + cls : "");
    div.textContent = text;
    screen.appendChild(div);
    screen.scrollTop = screen.scrollHeight;
  }

  function renderHintButtons(item) {
    hintsUnlocked = 0;
    const count = item.hintCount || 0;
    if (count === 0) {
      return '<p class="muted" style="font-size:13px">No hints for this one.</p>';
    }
    let html = '<div id="hintButtons">';
    for (let i = 1; i <= count; i++) {
      const cost = Math.round(Math.min(1, i * 0.33) * 100);
      html += `<button class="hint-btn" data-level="${i}" ${i === 1 ? "" : "disabled"}>
        <span>Hint ${i}</span><span class="cost">-${cost}%</span>
      </button>`;
    }
    html += '</div><div id="hintTexts"></div><div id="hintError"></div>';
    return html;
  }

  function wireHintButtons(item) {
    const buttons = document.querySelectorAll("#hintButtons .hint-btn");
    buttons.forEach((btn) => {
      btn.addEventListener("click", async () => {
        const level = Number(btn.dataset.level);
        btn.disabled = true;
        const errEl = document.getElementById("hintError");
        errEl.innerHTML = "";
        try {
          const res = await A72.apiFetch("/session/" + sessionId + "/hint", {
            method: "POST",
            body: JSON.stringify({ itemId: item.itemId, domain: item.domain, level }),
          });
          hintsUnlocked = res.hintsUnlocked;
          const textsEl = document.getElementById("hintTexts");
          const div = document.createElement("div");
          div.className = "hint-text";
          div.innerHTML = '<span class="n">' + level + ".</span>" + res.hint;
          textsEl.appendChild(div);
          btn.textContent = "";
          btn.remove();
          const next = document.querySelector('#hintButtons .hint-btn[data-level="' + (level + 1) + '"]');
          if (next) next.disabled = false;
        } catch (err) {
          errEl.innerHTML = '<p class="muted" style="font-size:12.5px">' + err.message + "</p>";
          btn.disabled = false;
        }
      });
    });
  }

  function wireFeedbackForm(item) {
    const toggle = document.getElementById("feedbackToggle");
    const form = document.getElementById("feedbackForm");
    toggle.addEventListener("click", (e) => {
      e.preventDefault();
      form.hidden = !form.hidden;
    });
    document.getElementById("feedbackSubmit").addEventListener("click", async () => {
      const comment = document.getElementById("feedbackText").value.trim();
      if (!comment) return;
      const flagged = document.getElementById("feedbackFlag").checked;
      const btn = document.getElementById("feedbackSubmit");
      const msg = document.getElementById("feedbackMsg");
      btn.disabled = true;
      try {
        await A72.apiFetch("/session/" + sessionId + "/feedback", {
          method: "POST",
          body: JSON.stringify({ itemId: item.itemId, domain: item.domain, comment, flagged }),
        });
        msg.textContent = "Thanks, sent.";
        document.getElementById("feedbackText").value = "";
      } catch (err) {
        msg.style.color = "var(--danger)";
        msg.textContent = "Couldn't send: " + err.message;
      } finally {
        btn.disabled = false;
      }
    });
  }

  function renderQuestion(item, index, total) {
    testActive = true;
    hintsUnlocked = 0;
    const shell = shellFor(item);
    const pct = Math.round(((index - 1) / total) * 100);
    app.innerHTML =
      '<div class="test-topbar">' +
        '<div class="progress-row">' +
          '<span class="label">Question ' + index + ' of ' + total + '</span>' +
          '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
        '</div>' +
        '<div class="test-timer" id="testTimer">00:00</div>' +
      '</div>' +
      '<div class="test-layout">' +
        '<div class="test-main">' +
          '<div class="card prompt-card"><h2>' + item.prompt + '</h2>' +
            '<a href="#" id="feedbackToggle" style="font-size:12.5px;display:inline-block;margin-top:8px">Something wrong with this question?</a>' +
            '<div id="feedbackForm" hidden style="margin-top:10px">' +
              '<textarea id="feedbackText" rows="2" style="width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:13.5px;font-family:inherit" placeholder="What\'s wrong, or any comment on this question…"></textarea>' +
              '<label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin:6px 0"><input type="checkbox" id="feedbackFlag"> Flag this as broken/incorrect</label>' +
              '<button class="btn btn-secondary" id="feedbackSubmit" style="font-size:13px;padding:7px 14px">Send feedback</button>' +
              '<span id="feedbackMsg" style="font-size:12.5px;color:var(--ok);margin-left:8px"></span>' +
            '</div>' +
          '</div>' +
          '<div class="term-panel ' + shell.css + '">' +
            '<div class="term-titlebar"><span class="term-dot r"></span><span class="term-dot y"></span><span class="term-dot g"></span><span class="term-name">' + shell.title + '</span></div>' +
            '<div class="term-screen" id="termScreen"></div>' +
            '<div class="term-inputrow">' +
              '<span class="term-ps1">' + shell.promptHtml + '</span>' +
              '<input id="termInput" class="term-input" autocomplete="off" spellcheck="false" aria-label="Terminal command">' +
            '</div>' +
          '</div>' +
          '<div id="answerError"></div>' +
          '<div class="answer-row">' +
            '<input id="answerInput" class="field" style="background:var(--surface-2);border:1px solid var(--line);color:var(--ink);padding:11px 13px;border-radius:8px;font-size:15px" placeholder="Type your answer" autocomplete="off">' +
            '<button class="btn btn-primary" id="submitAnswerBtn">Submit</button>' +
          '</div>' +
          '<p class="answer-note">Once you submit, you can\'t go back and change it.</p>' +
        '</div>' +
        '<div class="hints-panel">' +
          '<h3>Need a hand?</h3>' +
          renderHintButtons(item) +
        '</div>' +
      '</div>';

    updateTimerDisplay();
    wireHintButtons(item);
    wireFeedbackForm(item);

    const screen = document.getElementById("termScreen");
    const termInput = document.getElementById("termInput");
    shell.banner().split("\n").forEach((line) => appendLine(screen, line, "term-banner"));
    appendLine(screen, "");

    termInput.addEventListener("keydown", async (e) => {
      if (e.key !== "Enter" || !termInput.value.trim()) return;
      const command = termInput.value;
      termInput.value = "";
      appendLine(screen, shell.promptText + " " + command, "term-cmd");
      termInput.disabled = true;
      try {
        const res = await A72.apiFetch("/session/" + sessionId + "/" + shell.endpoint, {
          method: "POST",
          body: JSON.stringify({ itemId: item.itemId, domain: item.domain, command }),
        });
        (res.output || "").split("\n").forEach((line) => appendLine(screen, line, res.isError ? "term-err" : null));
      } catch (err) {
        appendLine(screen, "error: " + err.message, "term-err");
      } finally {
        termInput.disabled = false;
        termInput.focus();
      }
    });

    const submitBtn = document.getElementById("submitAnswerBtn");
    const answerInput = document.getElementById("answerInput");
    const errEl = document.getElementById("answerError");

    async function submitAnswer() {
      const answer = answerInput.value.trim();
      if (!answer) return;
      submitBtn.disabled = true;
      answerInput.disabled = true;
      errEl.innerHTML = "";
      try {
        const res = await A72.apiFetch("/session/" + sessionId + "/answer", {
          method: "POST",
          body: JSON.stringify({ itemId: item.itemId, domain: item.domain, answer }),
        });
        if (res.done) {
          stopTimer();
          showResult(sessionId, res.track);
          showSurveyModal(sessionId);
        } else if (res.item) {
          renderQuestion(res.item, res.itemIndex, res.totalItems);
        } else {
          renderError("Unexpected response from the server — please try refreshing.", { retry: true });
        }
      } catch (err) {
        errEl.innerHTML = '<div class="alert alert-error">' + err.message + "</div>";
        submitBtn.disabled = false;
        answerInput.disabled = false;
      }
    }

    submitBtn.addEventListener("click", submitAnswer);
    answerInput.addEventListener("keydown", (e) => { if (e.key === "Enter") submitAnswer(); });
  }

  async function showResult(sid, track) {
    testActive = false;
    app.innerHTML = '<div class="result"><p class="muted">Finishing up…</p></div>';
    let result = { track, domain_scores: null, composite_score: null };
    try {
      const res = await A72.apiFetch("/session/" + sid + "/result");
      if (res && res.track) result = res;
    } catch (e) { /* fall back to the track we already have */ }

    const isAdvanced = result.track === "Advanced";
    const badgeClass = isAdvanced ? "advanced" : "basic";
    const blurb = isAdvanced
      ? "You're placed on the Advanced track — Module 1 will move at the standard pace."
      : "You're placed on the Basic track — Module 1 starts with extra support to get you up to speed.";

    let scoreRows = "";
    if (result.domain_scores) {
      scoreRows = Object.keys(result.domain_scores)
        .filter((k) => k !== "_overall")
        .map((k) => (
          '<div class="card card-tight" style="display:flex;justify-content:space-between;margin-bottom:8px">' +
          '<span class="muted">' + k.replace(/_/g, " ") + '</span><span class="mono">' + result.domain_scores[k] + '%</span></div>'
        )).join("");
    }

    app.innerHTML =
      '<div class="result">' +
        '<div class="badge ' + badgeClass + ' track-badge">' + result.track + ' track</div>' +
        '<h1>You’re all set</h1>' +
        '<p class="blurb">' + blurb + '</p>' +
        (scoreRows ? '<div class="score-grid">' + scoreRows + '</div>' : '') +
        '<a href="index.html" class="btn btn-secondary">Back to home</a>' +
      '</div>';
  }

  const SURVEY_QUESTIONS = [
    { key: "difficulty", label: "How was the difficulty?", options: ["Too easy", "Just right", "Too hard"] },
    { key: "pace", label: "How was the pace / length?", options: ["Too short", "Good", "Too long"] },
    { key: "clarity", label: "Were the questions clearly worded?", options: ["Yes", "Mostly", "Not really"] },
    { key: "terminalFeel", label: "Did the simulated terminal feel realistic enough?", options: ["Yes", "Somewhat", "No"] },
  ];

  function showSurveyModal(sid) {
    const ratings = {};
    const overlay = document.createElement("div");
    overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px";
    const optionsHtml = SURVEY_QUESTIONS.map((q) => `
      <div style="margin-bottom:16px">
        <div style="font-size:13.5px;font-weight:600;margin-bottom:8px">${q.label}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${q.options.map((opt) => `<button type="button" class="btn btn-secondary survey-opt" data-key="${q.key}" data-val="${opt}" style="padding:7px 12px;font-size:13px">${opt}</button>`).join("")}
        </div>
      </div>`).join("");

    overlay.innerHTML = `
      <div class="card" style="max-width:460px;width:100%;max-height:90vh;overflow-y:auto">
        <h2 style="font-size:18px;margin-bottom:4px">Quick feedback?</h2>
        <p class="muted" style="font-size:13.5px;margin-bottom:18px">Totally optional, but it helps us improve the test. Doesn't affect your result.</p>
        ${optionsHtml}
        <div style="margin-bottom:16px">
          <div style="font-size:13.5px;font-weight:600;margin-bottom:8px">Anything else you'd change, or want to tell us?</div>
          <textarea id="surveyFreeText" rows="3" style="width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 11px;font-size:14px;font-family:inherit" placeholder="Optional — write as much or as little as you like"></textarea>
        </div>
        <div style="display:flex;gap:10px">
          <button class="btn btn-primary" id="surveySubmit">Send feedback</button>
          <button class="btn btn-secondary" id="surveySkip">Skip</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    overlay.querySelectorAll(".survey-opt").forEach((btn) => {
      btn.addEventListener("click", () => {
        ratings[btn.dataset.key] = btn.dataset.val;
        overlay.querySelectorAll('.survey-opt[data-key="' + btn.dataset.key + '"]').forEach((b) => {
          b.classList.toggle("btn-primary", b === btn);
          b.classList.toggle("btn-secondary", b !== btn);
        });
      });
    });

    function close() { overlay.remove(); }
    overlay.querySelector("#surveySkip").addEventListener("click", close);
    overlay.querySelector("#surveySubmit").addEventListener("click", async () => {
      const freeText = overlay.querySelector("#surveyFreeText").value.trim();
      const btn = overlay.querySelector("#surveySubmit");
      btn.disabled = true;
      try {
        await A72.apiFetch("/session/" + sid + "/survey", {
          method: "POST",
          body: JSON.stringify({ ratings, freeText }),
        });
      } catch (e) { /* non-critical, close either way */ }
      close();
    });
  }

  (async function init() {
    const signedIn = await A72.isSignedIn();
    A72.renderAuthNav(document.getElementById("authNav"));
    if (!signedIn) { A72.redirectToSignIn("test.html"); return; }
    renderBegin();
  })();
})();
</script>
</body>
</html>
