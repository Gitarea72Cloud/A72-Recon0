<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — A72-Recon0</title>
<link rel="stylesheet" href="theme.css">
<style>
  .adminwrap { max-width: 1100px; margin: 0 auto; padding: 32px 24px 100px; }
  .pagehead { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 24px; }
  .pagehead h1 { font-size: 26px; margin: 0; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
  .tab { padding: 10px 16px; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
  .tab.active { color: var(--ink); border-bottom-color: var(--cta); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
  .stat .v { font-family: ui-monospace, monospace; font-size: 24px; font-weight: 700; }
  .stat .l { font-size: 12.5px; color: var(--muted); margin-top: 4px; }

  .section { margin-bottom: 36px; }
  .section h2 { font-size: 16px; margin-bottom: 12px; }

  /* ---- collapsed-by-default detail panels: headline numbers stay
     visible, heavier tables/charts open on demand ("zoom in") ---- */
  details.collapsible {
    border: 1px solid var(--line); border-radius: var(--radius);
    margin-bottom: 14px; overflow: hidden; background: var(--surface);
  }
  details.collapsible > summary {
    list-style: none; cursor: pointer; padding: 14px 18px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  details.collapsible > summary::-webkit-details-marker { display: none; }
  details.collapsible > summary::after {
    content: "+"; font-size: 18px; line-height: 1; color: var(--muted); flex: 0 0 auto;
  }
  details.collapsible[open] > summary::after { content: "\2212"; }
  details.collapsible > summary:hover { background: var(--surface-2); }
  details.collapsible > summary h2 { font-size: 15px; margin: 0; }
  details.collapsible > summary .summary-line { font-size: 12.5px; color: var(--muted); margin-top: 3px; font-weight: 400; }
  details.collapsible > .panel-body { padding: 4px 18px 18px; border-top: 1px solid var(--line); }

  table.datatable { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.datatable th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); }
  table.datatable td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.datatable tr:hover td { background: var(--surface-2); }
  .tblwrap { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; overflow-x: auto; }

  .bar-track { width: 80px; height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 6px; }
  .bar-fill { height: 100%; border-radius: 999px; }
  .bar-fill.ok { background: var(--ok); } .bar-fill.warn { background: var(--basic); } .bar-fill.bad { background: var(--danger); }

  .fb-card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; font-size: 13.5px; }
  .fb-card .meta { font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
  .fb-card.flagged { border-color: var(--danger); }

  /* ---- domain containers (Questions tab + per-question performance) ---- */
  .domain-container { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 16px; overflow: hidden; }
  .domain-container h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface-2); display: flex; justify-content: space-between; }
  .domain-container table.datatable { font-size: 13px; }
  .domain-container .tblwrap { border: none; border-radius: 0; }
  .search-row { margin-bottom: 18px; }
  .search-row input { width: 100%; max-width: 360px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); padding: 9px 13px; border-radius: 8px; font-size: 13.5px; }
  .row-actions a { font-size: 12.5px; margin-right: 10px; }
  .row-actions a.danger { color: var(--danger); }

  .genbox { background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line)); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 26px; }
  .genbox h3 { margin: 0 0 4px; font-size: 15px; }
  .genbox p.muted { margin: 0 0 14px; font-size: 13px; }
  .gen-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .gen-row select, .gen-row input, textarea.field {
    width: 100%; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink);
    padding: 9px 11px; border-radius: 8px; font-size: 13.5px; font-family: inherit;
  }
  textarea.field { min-height: 60px; resize: vertical; }

  .qform { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; margin-bottom: 26px; }
  .qform .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .qform label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
  .qform input, .qform select, .qform textarea {
    width: 100%; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink);
    padding: 9px 11px; border-radius: 8px; font-size: 13.5px; font-family: inherit;
  }
  .qform textarea { min-height: 50px; resize: vertical; }
  .files-editor { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 12px; }
  .file-row { display: grid; grid-template-columns: 160px 1fr 32px; gap: 8px; margin-bottom: 8px; }
  .file-row input, .file-row textarea { font-size: 12.5px; }
  .file-row button { background: transparent; border: none; color: var(--danger); cursor: pointer; font-size: 16px; }

  /* ---- modules tab ---- */
  .module-admin-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 20px; margin-bottom: 12px;
  }
  .module-admin-card .toprow { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .module-admin-card .order { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); }
  .module-admin-card h3 { font-size: 15.5px; margin: 2px 0 4px; }
  .module-admin-card .stats { font-size: 12.5px; color: var(--muted); }
  .lock-pill {
    font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
    padding: 4px 10px; border-radius: 999px;
  }
  .lock-pill.locked { background: var(--surface-2); color: var(--muted); }
  .lock-pill.unlocked { background: var(--ok); color: #fff; }
  .chart-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 20px; }

  /* ---- module status bar: started -> in-progress / passed / failed ---- */
  .module-status-bar { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--surface-2); margin-top: 12px; }
  .module-status-bar .seg.inprogress { background: var(--basic); }
  .module-status-bar .seg.passed { background: var(--ok); }
  .module-status-bar .seg.failed { background: var(--danger); }
  .module-status-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-top: 8px; }
  .module-status-legend .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .module-status-legend .dot.inprogress { background: var(--basic); }
  .module-status-legend .dot.passed { background: var(--ok); }
  .module-status-legend .dot.failed { background: var(--danger); }
</style>
</head>
<body>

<div class="topnav">
  <div class="brand">A72<span>-Recon0</span></div>
  <nav>
    <a href="index.html">Home</a>
    <a href="help.html">Help</a>
    <a href="admin.html" class="active">Admin</a>
    <span id="authNav"></span>
  </nav>
</div>

<main>
  <div class="adminwrap">
    <div class="pagehead"><h1>Instructor dashboard</h1></div>
    <div class="tabs" id="tabs" hidden>
      <div class="tab" data-tab="overview">Overview</div>
      <div class="tab" data-tab="students">Students</div>
      <div class="tab" data-tab="questions">Questions</div>
      <div class="tab" data-tab="modules">Modules</div>
      <div class="tab" data-tab="feedback">Feedback</div>
    </div>
    <div id="app"><p class="muted">Loading…</p></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6/dist/amazon-cognito-identity.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(function () {
  const app = document.getElementById("app");
  const DOMAINS = ["linux_cli", "windows_cli", "red_team", "blue_team", "grey_team"];

  function esc(s) {
    const d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }
  function fmtDuration(secs) {
    if (secs == null) return "—";
    const m = Math.floor(secs / 60), s = secs % 60;
    return m + "m " + s + "s";
  }
  function fmtDate(ts) {
    if (!ts) return "—";
    return new Date(ts * 1000).toLocaleString();
  }
  function barClass(pct) {
    if (pct >= 70) return "ok";
    if (pct >= 40) return "warn";
    return "bad";
  }
  function groupByDomain(items, domainOf) {
    const groups = {};
    for (const it of items) {
      const d = domainOf(it);
      (groups[d] = groups[d] || []).push(it);
    }
    return groups;
  }

  // ---------------------------------------------------------------- Overview
  async function renderOverview() {
    const d = await A72.apiFetch("/admin/results");
    const trackRows = Object.keys(d.trackDistribution || {})
      .map((t) => `<div class="stat"><div class="v">${d.trackDistribution[t]}</div><div class="l">${t} track</div></div>`)
      .join("");
    const domainRows = Object.keys(d.domainAverages || {})
      .map((dom) => `
        <tr><td>${dom.replace(/_/g, " ")}</td><td>
          <span class="bar-track"><span class="bar-fill ${barClass(d.domainAverages[dom])}" style="width:${d.domainAverages[dom]}%"></span></span>
          ${d.domainAverages[dom]}%
        </td></tr>`)
      .join("");

    const byDomain = groupByDomain(d.itemStats || [], (it) => it.domain);
    const itemContainers = Object.keys(byDomain).sort().map((dom) => {
      const rows = byDomain[dom]
        .sort((a, b) => a.passRate - b.passRate)
        .map((it) => `
          <tr>
            <td class="mono">${it.itemId}</td>
            <td>${it.answered}</td>
            <td><span class="bar-track"><span class="bar-fill ${barClass(it.passRate)}" style="width:${it.passRate}%"></span></span>${it.passRate}%</td>
            <td>${it.avgHints}</td>
          </tr>`).join("");
      return `
        <div class="domain-container">
          <h3>${dom.replace(/_/g, " ")}</h3>
          <div class="tblwrap"><table class="datatable">
            <thead><tr><th>Item</th><th>Answered</th><th>Pass rate</th><th>Avg. hints</th></tr></thead>
            <tbody>${rows}</tbody>
          </table></div>
        </div>`;
    }).join("");

    const domainValues = Object.values(d.domainAverages || {});
    const domainOverallAvg = domainValues.length ? Math.round((domainValues.reduce((a, b) => a + b, 0) / domainValues.length) * 10) / 10 : null;

    const itemStatsList = d.itemStats || [];
    const weakestItem = itemStatsList.length ? itemStatsList.slice().sort((a, b) => a.passRate - b.passRate)[0] : null;

    const modulesWithData = (d.modulePerformance || []).filter((m) => m.avgScore != null);
    const moduleOverallAvg = modulesWithData.length
      ? Math.round((modulesWithData.reduce((a, m) => a + m.avgScore, 0) / modulesWithData.length) * 10) / 10 : null;

    const translationSignals = d.translationSignals || [];
    const translationRows = translationSignals.map((t) => `
      <tr>
        <td><a href="admin-student.html?id=${encodeURIComponent(t.studentId)}">${t.email}</a></td>
        <td>${t.count}</td>
        <td>${fmtDate(t.lastRequestedAt)}</td>
      </tr>`).join("");

    return `
      <div class="stats">
        <div class="stat"><div class="v">${d.provisionedAccounts ?? "—"}</div><div class="l">Provisioned accounts</div></div>
        <div class="stat"><div class="v">${d.totalStarted}</div><div class="l">Started placement</div></div>
        <div class="stat"><div class="v">${d.totalCompleted}</div><div class="l">Completed (${d.completionRate}%)</div></div>
        <div class="stat"><div class="v">${d.avgCompositeScore}%</div><div class="l">Avg. composite score</div></div>
        <div class="stat"><div class="v">${fmtDuration(d.avgDurationSeconds)}</div><div class="l">Avg. time to complete</div></div>
        ${trackRows}
      </div>

      <details class="collapsible">
        <summary>
          <div>
            <h2>Average score by domain</h2>
            <div class="summary-line">${domainValues.length ? domainValues.length + " domains tracked · overall avg " + domainOverallAvg + "%" : "No completed sessions yet"}</div>
          </div>
        </summary>
        <div class="panel-body">
          <div class="tblwrap"><table class="datatable">
            <thead><tr><th>Domain</th><th>Cohort average</th></tr></thead>
            <tbody>${domainRows || '<tr><td colspan="2" class="muted">No completed sessions yet.</td></tr>'}</tbody>
          </table></div>
        </div>
      </details>

      <details class="collapsible">
        <summary>
          <div>
            <h2>Per-question performance</h2>
            <div class="summary-line">${itemStatsList.length ? itemStatsList.length + " questions tracked · weakest: " + weakestItem.itemId + " (" + weakestItem.passRate + "% pass)" : "No answers recorded yet"}</div>
          </div>
        </summary>
        <div class="panel-body">
          <p class="muted" style="font-size:13px;margin-top:0">Grouped by domain, hardest first within each — low pass rate or high hint usage flags a question worth reviewing (or a topic the cohort needs more support on).</p>
          ${itemContainers || '<p class="muted">No answers recorded yet.</p>'}
        </div>
      </details>

      <details class="collapsible">
        <summary>
          <div>
            <h2>Cohort progress across modules</h2>
            <div class="summary-line">${modulesWithData.length ? modulesWithData.length + " module(s) with data · overall avg " + moduleOverallAvg + "%" : "No completed module assessments yet"}</div>
          </div>
        </summary>
        <div class="panel-body">
          <p class="muted" style="font-size:13px;margin-top:0">Average module-assessment score, in module order — how the cohort as a whole is trending through the programme.</p>
          <div class="chart-card">
            ${A72.renderLineChart(
              modulesWithData.map((m) => ({ label: "M" + String(m.order).padStart(2, "0"), value: m.avgScore }))
            )}
          </div>
        </div>
      </details>

      <details class="collapsible">
        <summary>
          <div>
            <h2>Language support signals</h2>
            <div class="summary-line">${translationSignals.length ? translationSignals.length + " student(s) have clicked \"Translate\"" : "No translation requests yet"}</div>
          </div>
        </summary>
        <div class="panel-body">
          <p class="muted" style="font-size:13px;margin-top:0">Students who clicked "Translate to Spanish" on a question — the button itself just shows an English-encouragement nudge, this is who might benefit from extra language support.</p>
          <div class="tblwrap"><table class="datatable">
            <thead><tr><th>Student</th><th>Times requested</th><th>Most recent</th></tr></thead>
            <tbody>${translationRows || '<tr><td colspan="3" class="muted">No translation requests yet.</td></tr>'}</tbody>
          </table></div>
        </div>
      </details>

      <p class="muted" style="font-size:12.5px">${d.feedbackCount} question-feedback comment(s) and ${d.surveyCount} exit-survey response(s) — see the Feedback tab.</p>
    `;
  }

  // ---------------------------------------------------------------- Students
  async function renderStudents() {
    const d = await A72.apiFetch("/admin/students");
    const rows = d.students.map((s) => `
      <tr>
        <td><a href="admin-student.html?id=${encodeURIComponent(s.studentId)}">${s.email}</a></td>
        <td>${s.status === "done" ? '<span class="badge ' + (s.track === "Advanced" ? "advanced" : "basic") + '">' + s.track + "</span>" : '<span class="muted">in progress</span>'}</td>
        <td>${s.compositeScore != null ? s.compositeScore + "%" : "—"}</td>
        <td>${fmtDuration(s.durationSeconds)}</td>
        <td>${s.hintsUsedTotal || 0}</td>
        <td>${fmtDate(s.startedAt)}</td>
      </tr>`).join("");
    return `
      <div class="tblwrap"><table class="datatable">
        <thead><tr><th>Student</th><th>Track</th><th>Score</th><th>Duration</th><th>Hints used</th><th>Started</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="6" class="muted">No students have started yet.</td></tr>'}</tbody>
      </table></div>
    `;
  }

  // ---------------------------------------------------------------- Feedback
  async function renderFeedback() {
    const d = await A72.apiFetch("/admin/feedback");
    const fbCards = (d.itemFeedback || []).map((f) => `
      <div class="fb-card ${f.flagged ? "flagged" : ""}">
        <div class="meta">${f.domain.replace(/_/g, " ")} · ${f.itemId} · ${fmtDate(f.submittedAt)} ${f.flagged ? '· <strong style="color:var(--danger)">FLAGGED</strong>' : ""}</div>
        ${f.comment}
      </div>`).join("") || '<p class="muted">No question feedback submitted yet.</p>';
    const surveyCards = (d.surveys || []).map((s) => `
      <div class="fb-card">
        <div class="meta">${fmtDate(s.submittedAt)}</div>
        <div style="margin-bottom:6px">${Object.entries(s.ratings || {}).map(([k, v]) => `<span class="badge" style="background:var(--surface-2);color:var(--muted);margin-right:6px">${k}: ${v}</span>`).join("")}</div>
        ${s.freeText ? s.freeText : '<span class="muted">No comment left.</span>'}
      </div>`).join("") || '<p class="muted">No exit-survey responses yet.</p>';

    return `
      <div class="section"><h2>Question feedback</h2>${fbCards}</div>
      <div class="section"><h2>Exit survey responses</h2>${surveyCards}</div>
    `;
  }

  // ---------------------------------------------------------------- Questions
  let allQuestions = [];
  let allModules = [];
  let pendingQuestionSearch = null;

  async function loadModulesMeta() {
    if (allModules.length) return allModules;
    try {
      const data = await A72.apiFetch("/admin/modules");
      allModules = data.modules;
    } catch (e) {
      allModules = [];
    }
    return allModules;
  }

  function questionContainersHtml(list) {
    if (!list.length) return '<p class="muted">No questions match.</p>';
    const byDomain = groupByDomain(list, (q) => q.domain);
    return Object.keys(byDomain).sort().map((dom) => {
      const rows = byDomain[dom].sort((a, b) => a.itemId.localeCompare(b.itemId)).map((q) => `
        <tr>
          <td class="mono">${q.itemId}</td>
          <td>${q.type}</td>
          <td>${esc(q.prompt).slice(0, 70)}${q.prompt.length > 70 ? "…" : ""}</td>
          <td class="row-actions">
            <a href="#" data-edit="${q.domain}/${q.itemId}">Edit</a>
            <a href="#" class="danger" data-delete="${q.domain}/${q.itemId}">Delete</a>
          </td>
        </tr>`).join("");
      return `
        <div class="domain-container">
          <h3><span>${dom.replace(/_/g, " ")}</span><span>${byDomain[dom].length}</span></h3>
          <div class="tblwrap"><table class="datatable">
            <thead><tr><th>Item</th><th>Type</th><th>Prompt</th><th></th></tr></thead>
            <tbody>${rows}</tbody>
          </table></div>
        </div>`;
    }).join("");
  }

  function wireQuestionRowActions() {
    app.querySelectorAll("[data-edit]").forEach((a) => a.addEventListener("click", async (e) => {
      e.preventDefault();
      const [domain, itemId] = a.dataset.edit.split("/");
      const full = allQuestions.find((q) => q.domain === domain && q.itemId === itemId)
        || await A72.apiFetch(`/admin/questions/${domain}/${itemId}`);
      renderQuestionForm(full);
    }));
    app.querySelectorAll("[data-delete]").forEach((a) => a.addEventListener("click", async (e) => {
      e.preventDefault();
      const [domain, itemId] = a.dataset.delete.split("/");
      if (!confirm(`Delete ${domain}/${itemId}? This can't be undone.`)) return;
      await A72.apiFetch(`/admin/questions/${domain}/${itemId}`, { method: "DELETE" });
      renderQuestionsList();
    }));
  }

  function splitContainersHtml(list) {
    const placement = list.filter((q) => !q.domain.startsWith("module-"));
    const modules = list.filter((q) => q.domain.startsWith("module-"));
    let html = "";
    if (placement.length || !modules.length) {
      html += '<h2 style="font-size:14px;margin:0 0 10px">Placement domains</h2>' + questionContainersHtml(placement);
    }
    if (modules.length) {
      html += '<h2 style="font-size:14px;margin:22px 0 10px">Module assessments</h2>' + questionContainersHtml(modules);
    }
    return html;
  }

  async function renderQuestionsList() {
    app.innerHTML = '<p class="muted">Loading…</p>';
    try {
      const data = await A72.apiFetch("/admin/questions");
      allQuestions = data.questions;
    } catch (err) {
      app.innerHTML = '<div class="alert alert-error">' + err.message + "</div>";
      return;
    }
    const initialSearch = pendingQuestionSearch || "";
    pendingQuestionSearch = null;
    app.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div class="search-row" style="margin-bottom:0"><input id="qSearch" placeholder="Search by item id, prompt, or domain…" value="${initialSearch}"></div>
        <button class="btn btn-primary" id="newQBtn">+ New question</button>
      </div>
      <div id="qContainers"></div>
    `;
    function applyFilter(term) {
      term = term.trim().toLowerCase();
      const filtered = term
        ? allQuestions.filter((q) => q.itemId.toLowerCase().includes(term) || q.domain.toLowerCase().includes(term) || q.prompt.toLowerCase().includes(term))
        : allQuestions;
      document.getElementById("qContainers").innerHTML = splitContainersHtml(filtered);
      wireQuestionRowActions();
    }
    applyFilter(initialSearch);
    document.getElementById("newQBtn").addEventListener("click", () => renderQuestionForm(null));
    document.getElementById("qSearch").addEventListener("input", (e) => applyFilter(e.target.value));
  }

  function filesEditorHtml(files) {
    const entries = Object.entries(files || {});
    const rows = (entries.length ? entries : [["", ""]]).map(([name, content]) => `
      <div class="file-row">
        <input class="f-name" placeholder="filename.ext" value="${esc(name)}">
        <textarea class="f-content" placeholder="file content" rows="2">${esc(content)}</textarea>
        <button type="button" class="f-remove" title="Remove file">&times;</button>
      </div>`).join("");
    return `<div class="files-editor" id="filesEditor">${rows}</div><button type="button" class="btn btn-secondary" id="addFileBtn" style="font-size:12.5px;padding:6px 12px">+ Add file</button>`;
  }

  function wireFilesEditor() {
    document.getElementById("addFileBtn").addEventListener("click", () => {
      const div = document.getElementById("filesEditor");
      const row = document.createElement("div");
      row.className = "file-row";
      row.innerHTML = `<input class="f-name" placeholder="filename.ext"><textarea class="f-content" placeholder="file content" rows="2"></textarea><button type="button" class="f-remove">&times;</button>`;
      div.appendChild(row);
      row.querySelector(".f-remove").addEventListener("click", () => row.remove());
    });
    document.querySelectorAll(".f-remove").forEach((b) => b.addEventListener("click", () => b.closest(".file-row").remove()));
  }

  function collectFiles() {
    const files = {};
    document.querySelectorAll("#filesEditor .file-row").forEach((row) => {
      const name = row.querySelector(".f-name").value.trim();
      const content = row.querySelector(".f-content").value;
      if (name) files[name] = content;
    });
    return files;
  }

  async function renderQuestionForm(existing) {
    const isEdit = !!(existing && existing.domain && existing.itemId && existing.prompt !== undefined);
    const q = existing || {};
    const isTerminal = q.type ? q.type === "terminal" : true;
    const modules = await loadModulesMeta();
    const domainOptionsHtml =
      `<optgroup label="Placement domains">` +
        DOMAINS.map((d) => `<option value="${d}" ${d === q.domain ? "selected" : ""}>${d}</option>`).join("") +
      `</optgroup>` +
      (modules.length ? `<optgroup label="Module assessments">` +
        modules.map((m) => `<option value="${m.moduleId}" ${m.moduleId === q.domain ? "selected" : ""}>Module ${String(m.order).padStart(2, "0")} — ${m.title}</option>`).join("") +
      `</optgroup>` : "");

    app.innerHTML = `
      <div class="genbox">
        <h3>Draft with AI</h3>
        <p class="muted">Claude Haiku 4.5 via Bedrock drafts the question; any exact number/hash/decode value is computed by our own code afterward, not trusted from the model. Always review before saving. <span id="budgetLine"></span></p>
        <div class="gen-row">
          <select id="genDomain">${DOMAINS.map((d) => `<option value="${d}">${d}</option>`).join("")}</select>
          <select id="genType"><option value="terminal">terminal</option><option value="free-text">free-text</option></select>
        </div>
        <textarea id="genTopic" class="field" placeholder="Rough idea, e.g. &quot;check whether students know how to count characters in a decoded file&quot;"></textarea>
        <div id="genError"></div>
        <button class="btn btn-secondary" id="genBtn" style="margin-top:10px">Generate with AI</button>
      </div>

      <form class="qform" id="qform">
        <h3 style="margin-top:0">${isEdit ? "Edit" : "New"} question</h3>
        <div class="field-row">
          <div><label>Domain</label>
            <select id="fDomain" ${isEdit ? "disabled" : ""}>${domainOptionsHtml}</select>
          </div>
          <div><label>Item ID</label><input id="fItemId" value="${esc(q.itemId || "")}" ${isEdit ? "disabled" : ""} placeholder="e.g. linux-011"></div>
        </div>
        <div class="field-row">
          <div><label>Type</label>
            <select id="fType">
              <option value="terminal" ${isTerminal ? "selected" : ""}>terminal</option>
              <option value="free-text" ${!isTerminal ? "selected" : ""}>free-text</option>
            </select>
          </div>
          <div><label>Answer (comma-separate for multiple acceptable answers)</label>
            <input id="fAnswer" value="${esc(Array.isArray(q.answer_key) ? q.answer_key.join(", ") : (q.answer_key || ""))}">
          </div>
        </div>
        <label>Prompt</label>
        <textarea id="fPrompt" rows="2">${esc(q.prompt || "")}</textarea>
        <label style="margin-top:10px;display:block">Hints (3, progressively more specific)</label>
        <input id="fHint1" placeholder="Hint 1 -- a nudge" value="${esc((q.hints || [])[0] || "")}" style="margin-bottom:6px">
        <input id="fHint2" placeholder="Hint 2 -- names the command/concept" value="${esc((q.hints || [])[1] || "")}" style="margin-bottom:6px">
        <input id="fHint3" placeholder="Hint 3 -- near-complete answer" value="${esc((q.hints || [])[2] || "")}" style="margin-bottom:12px">
        <div id="terminalFields" ${isTerminal ? "" : "hidden"}>
          <label>Scenario files</label>
          ${filesEditorHtml((q.scenario || {}).files)}
        </div>
        <div id="formError" style="margin-top:12px"></div>
        <div style="display:flex;gap:10px;margin-top:16px">
          <button type="submit" class="btn btn-primary">${isEdit ? "Save changes" : "Create question"}</button>
          <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
        </div>
      </form>
    `;
    wireFilesEditor();

    document.getElementById("fType").addEventListener("change", (e) => {
      document.getElementById("terminalFields").hidden = e.target.value !== "terminal";
    });
    document.getElementById("cancelBtn").addEventListener("click", renderQuestionsList);

    document.getElementById("genBtn").addEventListener("click", async () => {
      const domain = document.getElementById("genDomain").value;
      const type = document.getElementById("genType").value;
      const topic = document.getElementById("genTopic").value.trim();
      const errEl = document.getElementById("genError");
      const btn = document.getElementById("genBtn");
      errEl.innerHTML = "";
      if (!topic) { errEl.innerHTML = '<div class="alert alert-error">Give it a rough topic/idea first.</div>'; return; }
      btn.disabled = true;
      btn.textContent = "Generating…";
      try {
        const res = await A72.apiFetch("/admin/questions/generate", {
          method: "POST", body: JSON.stringify({ domain, type, topic }),
        });
        document.getElementById("budgetLine").textContent =
          ` (AI budget used so far: $${res.budgetSpentUsd.toFixed(4)} of $${res.budgetMaxUsd})`;
        renderQuestionForm(res.draft);
      } catch (err) {
        errEl.innerHTML = '<div class="alert alert-error">' + err.message + "</div>";
      } finally {
        btn.disabled = false;
        btn.textContent = "Generate with AI";
      }
    });

    document.getElementById("qform").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errEl = document.getElementById("formError");
      errEl.innerHTML = "";
      const type = document.getElementById("fType").value;
      const answerRaw = document.getElementById("fAnswer").value.trim();
      const answerParts = answerRaw.split(",").map((s) => s.trim()).filter(Boolean);
      const domain = document.getElementById("fDomain").value;
      const body = {
        domain,
        checkpoint: domain.startsWith("module-") ? domain : "placement",
        itemId: document.getElementById("fItemId").value.trim(),
        type,
        prompt: document.getElementById("fPrompt").value.trim(),
        answer_key: answerParts.length > 1 ? answerParts : (answerParts[0] || ""),
        hints: [document.getElementById("fHint1").value.trim(), document.getElementById("fHint2").value.trim(), document.getElementById("fHint3").value.trim()],
      };
      if (type === "terminal") body.scenario = { files: collectFiles() };

      try {
        if (isEdit) {
          await A72.apiFetch(`/admin/questions/${q.domain}/${q.itemId}`, { method: "PUT", body: JSON.stringify(body) });
        } else {
          await A72.apiFetch("/admin/questions", { method: "POST", body: JSON.stringify(body) });
        }
        renderQuestionsList();
      } catch (err) {
        errEl.innerHTML = '<div class="alert alert-error">' + err.message + "</div>";
      }
    });
  }

  // ---------------------------------------------------------------- Modules
  async function renderModulesTab() {
    app.innerHTML = '<p class="muted">Loading…</p>';
    let modules;
    try {
      const data = await A72.apiFetch("/admin/modules");
      modules = data.modules;
    } catch (err) {
      app.innerHTML = '<div class="alert alert-error">' + err.message + "</div>";
      return;
    }
    allModules = modules;
    function statusBarHtml(m) {
      if (!m.started) return '<p class="muted" style="font-size:12px;margin:12px 0 0">No attempts yet.</p>';
      return `
        <div class="module-status-bar">
          <div class="seg inprogress" style="flex:${m.inProgress}"></div>
          <div class="seg passed" style="flex:${m.passed}"></div>
          <div class="seg failed" style="flex:${m.failed}"></div>
        </div>
        <div class="module-status-legend">
          <span>${m.started} started</span>
          <span><span class="dot inprogress"></span>${m.inProgress} in progress</span>
          <span><span class="dot passed"></span>${m.passed} passed (≥70%)</span>
          <span><span class="dot failed"></span>${m.failed} failed</span>
        </div>`;
    }
    app.innerHTML = modules.length
      ? modules.map((m) => `
        <div class="module-admin-card">
          <div class="toprow">
            <div>
              <div class="order">Module ${String(m.order).padStart(2, "0")} · ${esc(m.dateRange || "")}</div>
              <h3>${esc(m.title)}</h3>
              <div class="stats">${m.started} started · ${m.completed} completed${m.avgScore != null ? " · avg " + m.avgScore + "%" : ""}</div>
            </div>
            <div style="display:flex;align-items:center;gap:12px">
              <span class="lock-pill ${m.unlocked ? "unlocked" : "locked"}">${m.unlocked ? "Unlocked" : "Locked"}</span>
              <button class="btn btn-secondary" data-view-questions="${m.moduleId}">View questions</button>
              <button class="btn btn-secondary" data-toggle="${m.moduleId}" data-unlocked="${m.unlocked}">${m.unlocked ? "Lock" : "Unlock"}</button>
            </div>
          </div>
          ${statusBarHtml(m)}
        </div>`).join("")
      : '<p class="muted">No modules seeded yet — run scripts/seed_module_questions.py.</p>';

    app.querySelectorAll("[data-view-questions]").forEach((btn) => btn.addEventListener("click", () => {
      pendingQuestionSearch = btn.dataset.viewQuestions;
      document.querySelector('.tab[data-tab="questions"]').click();
    }));

    app.querySelectorAll("[data-toggle]").forEach((btn) => btn.addEventListener("click", async () => {
      const moduleId = btn.dataset.toggle;
      const currentlyUnlocked = btn.dataset.unlocked === "true";
      const next = !currentlyUnlocked;
      if (next && !confirm("Unlock this module? Every student will get an in-app notification (and email, if delivery is set up).")) return;
      btn.disabled = true;
      try {
        await A72.apiFetch(`/admin/modules/${moduleId}`, { method: "PUT", body: JSON.stringify({ unlocked: next }) });
        renderModulesTab();
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
      }
    }));
  }

  // ---------------------------------------------------------------- Tabs
  const TABS = { overview: renderOverview, students: renderStudents, feedback: renderFeedback };

  async function showTab(name) {
    document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.tab === name));
    if (name === "questions") {
      renderQuestionsList();
      return;
    }
    if (name === "modules") {
      renderModulesTab();
      return;
    }
    app.innerHTML = '<p class="muted">Loading…</p>';
    try {
      app.innerHTML = await TABS[name]();
    } catch (err) {
      app.innerHTML = '<div class="alert alert-error">Couldn\'t load this tab: ' + err.message + "</div>";
    }
  }

  (async function init() {
    const signedIn = await A72.isSignedIn();
    if (!signedIn) { A72.redirectToSignIn("admin.html"); return; }
    const instructor = await A72.isInstructor();
    A72.renderAuthNav(document.getElementById("authNav"));
    if (!instructor) {
      app.innerHTML = '<div class="alert alert-error">This page is for instructors only.</div><a href="index.html" class="btn btn-secondary">Back to home</a>';
      return;
    }
    document.getElementById("tabs").hidden = false;
    document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => showTab(t.dataset.tab)));
    showTab("overview");
  })();
})();
</script>
</body>
</html>
